<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 1240" font-family="Arial, Helvetica, sans-serif">
  <rect width="2100" height="1240" fill="#000000"/>

  <text x="60" y="70" fill="#ffffff" font-size="48" font-weight="bold">GuideSight — Architecture Overview</text>

  <!-- ===== Row 1: getting started ===== -->

  <!-- Open the app -->
  <rect x="60" y="160" width="330" height="160" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="60" y1="205" x2="390" y2="205" stroke="#ffffff" stroke-width="2"/>
  <text x="225" y="192" fill="#ffffff" font-size="24" text-anchor="middle">Open the app</text>
  <text x="225" y="248" fill="#ffffff" font-size="20" text-anchor="middle">Random device ID,</text>
  <text x="225" y="276" fill="#ffffff" font-size="20" text-anchor="middle">no login or account</text>

  <path d="M 390 240 L 480 240" fill="none" stroke="#ffffff" stroke-width="2"/>
  <polygon points="480,240 466,232 466,248" fill="#ffffff"/>

  <!-- First-run Setup -->
  <rect x="480" y="160" width="520" height="160" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="480" y1="205" x2="1000" y2="205" stroke="#ffffff" stroke-width="2"/>
  <text x="740" y="192" fill="#ffffff" font-size="24" text-anchor="middle">First-run Setup</text>
  <text x="740" y="248" fill="#ffffff" font-size="20" text-anchor="middle">Name · camera · microphone</text>
  <text x="740" y="276" fill="#ffffff" font-size="20" text-anchor="middle">Pair sensor by its ID (over Wi-Fi)</text>

  <path d="M 1000 240 L 1090 240" fill="none" stroke="#ffffff" stroke-width="2"/>
  <polygon points="1090,240 1076,232 1076,248" fill="#ffffff"/>

  <!-- Settings -->
  <rect x="1090" y="160" width="470" height="160" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="1090" y1="205" x2="1560" y2="205" stroke="#ffffff" stroke-width="2"/>
  <text x="1325" y="192" fill="#ffffff" font-size="24" text-anchor="middle">Settings</text>
  <text x="1325" y="248" fill="#ffffff" font-size="20" text-anchor="middle">Voice speed &amp; detail level,</text>
  <text x="1325" y="276" fill="#ffffff" font-size="20" text-anchor="middle">text size, contrast, zoom</text>

  <!-- Mock mode note -->
  <rect x="1660" y="160" width="380" height="160" rx="4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1850" y="200" fill="#9ca3af" font-size="22" text-anchor="middle">No API keys?</text>
  <text x="1850" y="248" fill="#9ca3af" font-size="19" text-anchor="middle">Every service gives canned</text>
  <text x="1850" y="276" fill="#9ca3af" font-size="19" text-anchor="middle">answers; data kept in memory</text>

  <!-- Walker icon -->
  <circle cx="200" cy="395" r="33" fill="#ea4335"/>
  <circle cx="250" cy="395" r="33" fill="#34a853"/>
  <circle cx="225" cy="430" r="33" fill="#4285f4"/>
  <text x="225" y="500" fill="#ffffff" font-size="22" text-anchor="middle">Walker</text>
  <path d="M 225 362 L 225 320" fill="none" stroke="#ffffff" stroke-width="2"/>
  <polygon points="225,320 217,336 233,336" fill="#ffffff"/>

  <!-- Settings -> Phone App -->
  <path d="M 1325 320 L 1325 555" fill="none" stroke="#ffffff" stroke-width="2"/>
  <polygon points="1325,555 1317,539 1333,539" fill="#ffffff"/>

  <!-- ===== Row 2: the walk ===== -->

  <!-- Harness -->
  <rect x="60" y="555" width="420" height="190" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="60" y1="600" x2="480" y2="600" stroke="#ffffff" stroke-width="2"/>
  <text x="270" y="587" fill="#ffffff" font-size="24" text-anchor="middle">Harness (ESP32)</text>
  <text x="270" y="635" fill="#ffffff" font-size="18" text-anchor="middle">HC-SR04 ultrasonic sensor + buzzer</text>
  <text x="270" y="663" fill="#ffffff" font-size="18" text-anchor="middle">Beeps faster as things near, offline too</text>
  <text x="270" y="691" fill="#ffffff" font-size="18" text-anchor="middle">Event &lt; 1.5 m, again each 50 cm closer</text>
  <text x="270" y="719" fill="#ffffff" font-size="18" text-anchor="middle">Buzzes the pattern the server sends</text>

  <!-- Harness <-> Server -->
  <path d="M 480 650 L 600 650" fill="none" stroke="#ffffff" stroke-width="2"/>
  <polygon points="600,650 586,642 586,658" fill="#ffffff"/>
  <polygon points="480,650 494,642 494,658" fill="#ffffff"/>
  <text x="540" y="634" fill="#ffffff" font-size="17" text-anchor="middle">Wi-Fi</text>
  <text x="540" y="678" fill="#9ca3af" font-size="16" text-anchor="middle">WebSocket</text>

  <!-- Flask Server -->
  <rect x="600" y="555" width="320" height="190" rx="4" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="760" y="642" fill="#ffffff" font-size="26" text-anchor="middle">Flask Server</text>
  <text x="760" y="676" fill="#9ca3af" font-size="17" text-anchor="middle">REST API + live link</text>
  <text x="760" y="700" fill="#9ca3af" font-size="17" text-anchor="middle">(flask-sock)</text>

  <!-- Server <-> Phone -->
  <path d="M 920 650 L 1040 650" fill="none" stroke="#ffffff" stroke-width="2"/>
  <polygon points="1040,650 1026,642 1026,658" fill="#ffffff"/>
  <polygon points="920,650 934,642 934,658" fill="#ffffff"/>
  <text x="980" y="634" fill="#ffffff" font-size="17" text-anchor="middle">HTTPS</text>
  <text x="980" y="678" fill="#9ca3af" font-size="16" text-anchor="middle">+ live WS</text>

  <!-- Phone App -->
  <rect x="1040" y="555" width="520" height="190" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="1040" y1="600" x2="1560" y2="600" stroke="#ffffff" stroke-width="2"/>
  <text x="1300" y="587" fill="#ffffff" font-size="24" text-anchor="middle">Phone Web App</text>
  <text x="1300" y="635" fill="#ffffff" font-size="18" text-anchor="middle">Home · Where to? · Guide · Ask · Read text</text>
  <text x="1300" y="663" fill="#ffffff" font-size="18" text-anchor="middle">"Where am I?" with compass direction</text>
  <text x="1300" y="691" fill="#ffffff" font-size="18" text-anchor="middle">Camera frame every 15 s (6 s when guiding)</text>
  <text x="1300" y="719" fill="#ffffff" font-size="18" text-anchor="middle">+ right away when the harness sees something</text>

  <path d="M 1560 650 L 1680 650" fill="none" stroke="#ffffff" stroke-width="2"/>
  <polygon points="1680,650 1666,642 1666,658" fill="#ffffff"/>

  <!-- Walker hears & feels -->
  <rect x="1680" y="555" width="360" height="190" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="1680" y1="600" x2="2040" y2="600" stroke="#ffffff" stroke-width="2"/>
  <text x="1860" y="587" fill="#ffffff" font-size="24" text-anchor="middle">Walker hears &amp; feels</text>
  <text x="1860" y="635" fill="#ffffff" font-size="18" text-anchor="middle">"Stairs 1 m ahead, stop"</text>
  <text x="1860" y="663" fill="#ffffff" font-size="18" text-anchor="middle">Voice in earbuds</text>
  <text x="1860" y="691" fill="#ffffff" font-size="18" text-anchor="middle">+ buzz on the harness</text>
  <text x="1860" y="719" fill="#ffffff" font-size="18" text-anchor="middle">+ stop screen for danger</text>

  <!-- ===== Row 3: services behind the server ===== -->

  <!-- bus -->
  <path d="M 760 745 L 760 880" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M 225 880 L 1875 880" fill="none" stroke="#ffffff" stroke-width="2"/>
  <g fill="none" stroke="#ffffff" stroke-width="2">
    <path d="M 225 880 L 225 925"/>
    <path d="M 555 880 L 555 925"/>
    <path d="M 885 880 L 885 925"/>
    <path d="M 1215 880 L 1215 925"/>
    <path d="M 1545 880 L 1545 925"/>
    <path d="M 1875 880 L 1875 925"/>
  </g>
  <g fill="#ffffff">
    <polygon points="225,925 217,909 233,909"/>
    <polygon points="555,925 547,909 563,909"/>
    <polygon points="885,925 877,909 893,909"/>
    <polygon points="1215,925 1207,909 1223,909"/>
    <polygon points="1545,925 1537,909 1553,909"/>
    <polygon points="1875,925 1867,909 1883,909"/>
  </g>

  <!-- Speech-to-Text -->
  <g>
    <circle cx="225" cy="990" r="65" fill="#4338ca"/>
    <rect x="200" y="975" width="10" height="30" fill="#ffffff"/>
    <rect x="218" y="965" width="10" height="50" fill="#ffffff"/>
    <rect x="236" y="975" width="10" height="30" fill="#ffffff"/>
    <text x="225" y="1095" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">Speech-to-Text</text>
    <text x="225" y="1130" fill="#9ca3af" font-size="17" text-anchor="middle">ElevenLabs Scribe</text>
    <text x="225" y="1155" fill="#9ca3af" font-size="17" text-anchor="middle">Voice questions; setup</text>
    <text x="225" y="1180" fill="#9ca3af" font-size="17" text-anchor="middle">answers stream live</text>
  </g>

  <!-- Gemini Vision -->
  <g>
    <circle cx="555" cy="990" r="65" fill="#ffffff"/>
    <path d="M 555 950 L 567 978 L 595 990 L 567 1002 L 555 1030 L 543 1002 L 515 990 L 543 978 Z" fill="#4285f4"/>
    <text x="555" y="1095" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">Gemini Vision</text>
    <text x="555" y="1130" fill="#9ca3af" font-size="17" text-anchor="middle">JSON: obstacle, clock</text>
    <text x="555" y="1155" fill="#9ca3af" font-size="17" text-anchor="middle">direction, distance, drops,</text>
    <text x="555" y="1180" fill="#9ca3af" font-size="17" text-anchor="middle">trips, sign &amp; bus text</text>
  </g>

  <!-- Hazard Filter -->
  <g>
    <circle cx="885" cy="990" r="65" fill="#dc2626"/>
    <path d="M 885 955 L 913 967 L 913 995 C 913 1013 900 1025 885 1030 C 870 1025 857 1013 857 995 L 857 967 Z" fill="none" stroke="#ffffff" stroke-width="4"/>
    <path d="M 870 992 L 881 1004 L 903 978" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="885" y="1095" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">Hazard Filter</text>
    <text x="885" y="1130" fill="#9ca3af" font-size="17" text-anchor="middle">Danger · drop · trip tiers</text>
    <text x="885" y="1155" fill="#9ca3af" font-size="17" text-anchor="middle">Stairs ≤ 1 m → stop screen</text>
    <text x="885" y="1180" fill="#9ca3af" font-size="17" text-anchor="middle">Step left / right / stop</text>
  </g>

  <!-- Google Maps -->
  <g>
    <circle cx="1215" cy="990" r="65" fill="#34a853"/>
    <path d="M 1215 1032 C 1195 1007 1185 993 1185 978 A 30 30 0 0 1 1245 978 C 1245 993 1235 1007 1215 1032 Z" fill="#ffffff"/>
    <circle cx="1215" cy="978" r="11" fill="#34a853"/>
    <text x="1215" y="1095" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">Google Maps</text>
    <text x="1215" y="1130" fill="#9ca3af" font-size="17" text-anchor="middle">Places + Routes:</text>
    <text x="1215" y="1155" fill="#9ca3af" font-size="17" text-anchor="middle">walking directions</text>
    <text x="1215" y="1180" fill="#9ca3af" font-size="17" text-anchor="middle">Geocoding: "Where am I?"</text>
  </g>

  <!-- Firestore -->
  <g>
    <circle cx="1545" cy="990" r="65" fill="#f59e0b"/>
    <ellipse cx="1545" cy="970" rx="28" ry="10" fill="none" stroke="#ffffff" stroke-width="4"/>
    <path d="M 1517 970 L 1517 1010 C 1517 1016 1529 1021 1545 1021 C 1561 1021 1573 1016 1573 1010 L 1573 970" fill="none" stroke="#ffffff" stroke-width="4"/>
    <path d="M 1517 990 C 1517 996 1529 1001 1545 1001 C 1561 1001 1573 996 1573 990" fill="none" stroke="#ffffff" stroke-width="4"/>
    <text x="1545" y="1095" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">Firestore (optional)</text>
    <text x="1545" y="1130" fill="#9ca3af" font-size="17" text-anchor="middle">Profile, setup, settings</text>
    <text x="1545" y="1155" fill="#9ca3af" font-size="17" text-anchor="middle">+ walk events per device ID</text>
    <text x="1545" y="1180" fill="#9ca3af" font-size="17" text-anchor="middle">In memory without a key</text>
  </g>

  <!-- Text-to-Speech -->
  <g>
    <circle cx="1875" cy="990" r="65" fill="#9333ea"/>
    <polygon points="1835,980 1853,980 1867,966 1867,1014 1853,1000 1835,1000" fill="#ffffff"/>
    <path d="M 1877 975 A 24 24 0 0 1 1877 1005" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <path d="M 1885 965 A 40 40 0 0 1 1885 1015" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <text x="1875" y="1095" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">Text-to-Speech</text>
    <text x="1875" y="1130" fill="#9ca3af" font-size="17" text-anchor="middle">ElevenLabs Flash voice</text>
    <text x="1875" y="1155" fill="#9ca3af" font-size="17" text-anchor="middle">Phone's own voice</text>
    <text x="1875" y="1180" fill="#9ca3af" font-size="17" text-anchor="middle">without a key</text>
  </g>
</svg>
