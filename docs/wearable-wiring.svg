<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 1350" font-family="Arial, Helvetica, sans-serif">
  <rect width="2100" height="1350" fill="#000000"/>

  <text x="60" y="70" fill="#ffffff" font-size="48" font-weight="bold">GuideSight — Wearable Wiring</text>
  <text x="60" y="110" fill="#9ca3af" font-size="24">ESP32 + HC-SR04 + buzzer (+ optional vibration motor)</text>

  <!-- Phone App -->
  <rect x="845" y="150" width="225" height="80" rx="16" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="957" y="198" fill="#ffffff" font-size="24" text-anchor="middle">Phone App</text>
  <line x1="957" y1="230" x2="957" y2="285" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="975" y="262" fill="#38bdf8" font-size="18">Bluetooth LE (distance)</text>

  <!-- HC-SR04 -->
  <rect x="85" y="285" width="375" height="240" rx="14" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="180" cy="380" r="55" fill="#0b1f45" stroke="#9ca3af" stroke-width="3"/>
  <circle cx="180" cy="380" r="30" fill="#0b1f45" stroke="#6b7280" stroke-width="2"/>
  <circle cx="320" cy="380" r="55" fill="#0b1f45" stroke="#9ca3af" stroke-width="3"/>
  <circle cx="320" cy="380" r="30" fill="#0b1f45" stroke="#6b7280" stroke-width="2"/>
  <text x="250" y="500" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">HC-SR04 Ultrasonic</text>

  <circle cx="460" cy="328" r="6" fill="#facc15"/>
  <text x="445" y="334" fill="#ffffff" font-size="19" text-anchor="end">VCC</text>
  <circle cx="460" cy="378" r="6" fill="#facc15"/>
  <text x="445" y="384" fill="#ffffff" font-size="19" text-anchor="end">TRIG</text>
  <circle cx="460" cy="428" r="6" fill="#facc15"/>
  <text x="445" y="434" fill="#ffffff" font-size="19" text-anchor="end">ECHO</text>
  <circle cx="460" cy="478" r="6" fill="#facc15"/>
  <text x="445" y="484" fill="#ffffff" font-size="19" text-anchor="end">GND</text>

  <!-- ESP32 -->
  <rect x="800" y="285" width="315" height="500" rx="14" fill="none" stroke="#2dd4bf" stroke-width="2"/>
  <rect x="845" y="330" width="225" height="105" fill="#111827" stroke="#6b7280" stroke-width="2"/>
  <text x="957" y="390" fill="#ffffff" font-size="22" text-anchor="middle">ESP32</text>
  <text x="957" y="665" fill="#ffffff" font-size="22" text-anchor="middle">ESP32 Dev Board</text>

  <circle cx="800" cy="372" r="6" fill="#facc15"/>
  <text x="815" y="378" fill="#ffffff" font-size="19">VIN 5V</text>
  <circle cx="800" cy="442" r="6" fill="#facc15"/>
  <text x="815" y="448" fill="#ffffff" font-size="19">GND</text>
  <circle cx="800" cy="512" r="6" fill="#facc15"/>
  <text x="815" y="518" fill="#ffffff" font-size="19">GPIO 5</text>
  <circle cx="800" cy="585" r="6" fill="#facc15"/>
  <text x="815" y="591" fill="#ffffff" font-size="19">GPIO 18</text>

  <circle cx="1115" cy="372" r="6" fill="#facc15"/>
  <text x="1100" y="378" fill="#ffffff" font-size="19" text-anchor="end">3V3</text>
  <circle cx="1115" cy="442" r="6" fill="#facc15"/>
  <text x="1100" y="448" fill="#ffffff" font-size="19" text-anchor="end">GND</text>
  <circle cx="1115" cy="512" r="6" fill="#facc15"/>
  <text x="1100" y="518" fill="#ffffff" font-size="19" text-anchor="end">GPIO 23</text>
  <circle cx="1115" cy="568" r="6" fill="#facc15"/>
  <text x="1100" y="574" fill="#ffffff" font-size="19" text-anchor="end">GPIO 19</text>

  <rect x="915" y="785" width="90" height="25" fill="#9ca3af"/>
  <line x1="957" y1="810" x2="957" y2="865" stroke="#9ca3af" stroke-width="3"/>
  <text x="975" y="862" fill="#9ca3af" font-size="18">USB cable</text>

  <rect x="845" y="925" width="225" height="95" rx="6" fill="#374151" stroke="#6b7280" stroke-width="2"/>
  <text x="957" y="965" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">Power Bank</text>
  <text x="957" y="995" fill="#9ca3af" font-size="18" text-anchor="middle">powers everything</text>
  <line x1="957" y1="890" x2="957" y2="925" stroke="#9ca3af" stroke-width="3"/>

  <!-- Active Buzzer Module -->
  <rect x="1445" y="285" width="300" height="240" rx="14" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
  <circle cx="1560" cy="405" r="90" fill="none" stroke="#6b7280" stroke-width="3"/>
  <circle cx="1560" cy="405" r="8" fill="#6b7280"/>
  <circle cx="1455" cy="328" r="6" fill="#facc15"/>
  <text x="1470" y="334" fill="#ffffff" font-size="19">+</text>
  <circle cx="1455" cy="378" r="6" fill="#facc15"/>
  <text x="1470" y="384" fill="#ffffff" font-size="19">−</text>
  <circle cx="1455" cy="428" r="6" fill="#facc15"/>
  <text x="1470" y="434" fill="#ffffff" font-size="19">S</text>
  <text x="1595" y="505" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">Active Buzzer Module</text>

  <!-- ground symbols -->
  <g stroke="#9ca3af" stroke-width="3">
    <line x1="480" y1="560" x2="480" y2="595"/>
    <line x1="462" y1="595" x2="498" y2="595"/>
    <line x1="469" y1="605" x2="491" y2="605"/>
    <line x1="476" y1="615" x2="484" y2="615"/>
  </g>
  <g stroke="#9ca3af" stroke-width="3">
    <line x1="790" y1="460" x2="790" y2="490"/>
    <line x1="772" y1="490" x2="808" y2="490"/>
    <line x1="779" y1="500" x2="801" y2="500"/>
    <line x1="786" y1="510" x2="794" y2="510"/>
  </g>
  <g stroke="#9ca3af" stroke-width="3">
    <line x1="660" y1="720" x2="660" y2="750"/>
    <line x1="642" y1="750" x2="678" y2="750"/>
    <line x1="649" y1="760" x2="671" y2="760"/>
    <line x1="656" y1="770" x2="664" y2="770"/>
  </g>

  <!-- wires -->
  <!-- VCC red -->
  <path d="M 466 328 L 700 328 L 700 372 L 800 372" fill="none" stroke="#ef4444" stroke-width="4"/>
  <!-- TRIG yellow -->
  <path d="M 466 378 L 720 378 L 720 512 L 800 512" fill="none" stroke="#eab308" stroke-width="4"/>
  <!-- HC-SR04 GND gray stub -->
  <path d="M 466 428 L 480 428 L 480 560" fill="none" stroke="#9ca3af" stroke-width="4"/>
  <!-- ECHO green -> divider -> GPIO18 -->
  <path d="M 466 478 L 620 478 L 620 585 L 660 585" fill="none" stroke="#22c55e" stroke-width="4"/>
  <rect x="565" y="572" width="60" height="26" fill="#000000" stroke="#22c55e" stroke-width="2"/>
  <text x="595" y="565" fill="#eab308" font-size="18" text-anchor="middle">1 kΩ</text>
  <path d="M 660 585 L 800 585" fill="none" stroke="#22c55e" stroke-width="4"/>
  <circle cx="660" cy="585" r="6" fill="#22c55e"/>
  <rect x="648" y="640" width="26" height="60" fill="#000000" stroke="#22c55e" stroke-width="2"/>
  <line x1="660" y1="591" x2="660" y2="640" stroke="#22c55e" stroke-width="4"/>
  <text x="730" y="675" fill="#eab308" font-size="18">2 kΩ</text>
  <line x1="660" y1="700" x2="660" y2="720" stroke="#22c55e" stroke-width="4"/>
  <!-- ESP32 GND left stub -->
  <path d="M 794 442 L 790 442 L 790 460" fill="none" stroke="#9ca3af" stroke-width="4"/>
  <!-- 3V3 red to buzzer + -->
  <path d="M 1121 372 L 1300 372 L 1300 328 L 1449 328" fill="none" stroke="#ef4444" stroke-width="4"/>
  <!-- GND right gray to buzzer - -->
  <path d="M 1121 442 L 1320 442 L 1320 378 L 1449 378" fill="none" stroke="#9ca3af" stroke-width="4"/>
  <!-- GPIO23 purple to buzzer S -->
  <path d="M 1121 512 L 1340 512 L 1340 428 L 1449 428" fill="none" stroke="#c026d3" stroke-width="4"/>
  <!-- GPIO19 orange to driver -->
  <path d="M 1121 568 L 1180 568 L 1180 640 L 1445 640" fill="none" stroke="#f97316" stroke-width="4"/>
  <text x="1145" y="610" fill="#f97316" font-size="18">via 1 kΩ</text>

  <!-- Driver box -->
  <rect x="1445" y="615" width="330" height="130" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10,8"/>
  <text x="1610" y="665" fill="#ffffff" font-size="20" text-anchor="middle">Driver: 2N2222 transistor</text>
  <text x="1610" y="693" fill="#ffffff" font-size="20" text-anchor="middle">+ 1N4148 diode</text>
  <text x="1610" y="775" fill="#9ca3af" font-size="17" text-anchor="middle">OPTIONAL — coin vibration motor (MLH lab)</text>
  <text x="1610" y="800" fill="#9ca3af" font-size="17" text-anchor="middle">buzzer alone is fine for the demo</text>

  <path d="M 1775 680 L 1835 680" fill="none" stroke="#f97316" stroke-width="4"/>
  <circle cx="1900" cy="680" r="60" fill="#3f2a24" stroke="#9ca3af" stroke-width="2"/>
  <text x="1900" y="690" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle">M</text>
  <line x1="1900" y1="620" x2="1900" y2="590" stroke="#ef4444" stroke-width="3"/>
  <polygon points="1900,590 1892,606 1908,606" fill="#ef4444"/>
  <text x="1920" y="600" fill="#ef4444" font-size="18">to 3V3</text>

  <!-- left callouts -->
  <text x="90" y="1065" fill="#eab308" font-size="24" font-weight="bold">⚠ Why the two resistors?</text>
  <text x="90" y="1105" fill="#ffffff" font-size="19">HC-SR04 ECHO outputs 5V, but ESP32 pins are 3.3V.</text>
  <text x="90" y="1133" fill="#ffffff" font-size="19">The 1 kΩ + 2 kΩ divider drops it to ~3.3V so you</text>
  <text x="90" y="1161" fill="#ffffff" font-size="19">don't fry the pin.</text>

  <text x="90" y="1215" fill="#eab308" font-size="24" font-weight="bold">⏚ Ground</text>
  <text x="90" y="1255" fill="#ffffff" font-size="19">All ground symbols connect together (use the</text>
  <text x="90" y="1283" fill="#ffffff" font-size="19">breadboard's blue rail).</text>

  <!-- right legend -->
  <text x="1300" y="1065" fill="#ffffff" font-size="24" font-weight="bold">Wire colours</text>
  <line x1="1300" y1="1105" x2="1340" y2="1105" stroke="#ef4444" stroke-width="5"/>
  <text x="1355" y="1111" fill="#ffffff" font-size="19">Power (5V / 3V3)</text>
  <line x1="1300" y1="1143" x2="1340" y2="1143" stroke="#9ca3af" stroke-width="5"/>
  <text x="1355" y="1149" fill="#ffffff" font-size="19">Ground</text>
  <line x1="1300" y1="1181" x2="1340" y2="1181" stroke="#eab308" stroke-width="5"/>
  <text x="1355" y="1187" fill="#ffffff" font-size="19">TRIG → GPIO 5</text>
  <line x1="1300" y1="1219" x2="1340" y2="1219" stroke="#22c55e" stroke-width="5"/>
  <text x="1355" y="1225" fill="#ffffff" font-size="19">ECHO → divider → GPIO 18</text>
  <line x1="1300" y1="1257" x2="1340" y2="1257" stroke="#c026d3" stroke-width="5"/>
  <text x="1355" y="1263" fill="#ffffff" font-size="19">Buzzer S → GPIO 23</text>
  <line x1="1300" y1="1295" x2="1340" y2="1295" stroke="#f97316" stroke-width="5"/>
  <text x="1355" y="1301" fill="#ffffff" font-size="19">Motor driver → GPIO 19</text>
</svg>
