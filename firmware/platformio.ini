; GuideSight harness: ESP32 + MPU6050 + vibration motor
; Build & flash:  pio run -t upload   |   Serial monitor:  pio device monitor
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
